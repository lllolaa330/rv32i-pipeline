name: Recovered modules (not full CPU)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Verify recovered sources and documented module behavior
        run: make check
